[project]
name = "kvmhub"
version = "0.1.0"
description = "Local Manager/Worker proof of concept for BMC console access"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.4", "uvicorn==0.54.0", "aiohttp==3.14.5",
  "PyJWT==2.15.1", "cryptography==50.0.2", "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

