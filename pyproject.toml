[project]
name = "kvmhub"
version = "0.1.0"
description = "Local Manager/Worker proof of concept for BMC console access"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.4", "uvicorn==0.54.0", "aiohttp==3.14.5",
  "PyJWT==2.15.1", "cryptography==50.0.2", "httpx==0.28.1",
  # Production control plane (same stack family as IPIP): MySQL + SQLAlchemy
  # + Alembic, Redis, bcrypt local accounts, dotenv configuration.
  "SQLAlchemy==2.0.50", "PyMySQL==1.2.0", "alembic==1.16.5",
  "redis==8.0.0", "bcrypt==5.0.0", "python-dotenv==1.2.2",
  # Independent fixed-Host route resolver process: uvloop is mandatory for the
  # Python fallback in design §6.3; the module still imports without it locally.
  "uvloop==0.23.0",
  # Optional out-of-band BMC reset (platform maintenance action). Imported
  # lazily in kvmhub/platform/bmc_reset.py so the app still imports without it.
  "pyghmi==1.6.19", "python-dateutil==4.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

